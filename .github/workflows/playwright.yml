name: Playwright Tests

on:
  push:
    branches: [main, master, 'claude/**']
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.9.1
        with:
          distribution: corretto
          java-version: '17'
          check-latest: true
          cache: 'maven'

      - name: Verify Java security update
        shell: bash
        run: |
          minimum_java=17.0.21.1
          installed_java=$(sed -nE 's/^JAVA_VERSION="([0-9]+(\.[0-9]+)+)"$/\1/p' "$JAVA_HOME/release")
          if [[ "$installed_java" != 17.* ]] || ! printf '%s\n' "$minimum_java" "$installed_java" | sort -VC; then
            printf '::error::Java %s or later on the 17 release line is required (found %s).\n' "$minimum_java" "${installed_java:-unknown}"
            exit 1
          fi
          java -version

      - name: Build project
        run: mvn compile test-compile --no-transfer-progress

      - name: Install Playwright browsers
        run: mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps chromium"

      - name: Run tests
        run: mvn test --no-transfer-progress

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            test-results/
            target/surefire-reports/
          retention-days: 14
