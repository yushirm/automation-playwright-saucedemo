name: Playwright Tests

on:
  push:
    branches: [main, master, 'claude/**']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  checks:
    name: Format and static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: corretto
          java-version: '25'
          check-latest: true
          cache: maven
          cache-dependency-path: |
            pom.xml
            .github/workflows/playwright.yml

      # Compiles with Error Prone (-Werror), then runs Spotless, Checkstyle and PMD.
      - name: Check formatting and static analysis
        run: mvn -B -ntp verify -DskipTests

      # The test jobs also need the exec and Allure plugins, which `verify` doesn't use. Fetching
      # them here puts them in the saved cache; otherwise each test job fetches them from Maven
      # Central itself, which has answered with HTTP 429 (rate limited).
      - name: Download the plugins the test jobs use
        run: mvn -B -ntp dependency:resolve-plugins

  test:
    name: Tests (${{ matrix.browser }})
    # Wait for the static-analysis job, which downloads the Maven dependencies and plugins once and
    # saves the cache. Without this, a pom.xml change (a new cache key) sends all four jobs to
    # Maven Central at once, and Central has answered with HTTP 429 (rate limited).
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: corretto
          java-version: '25'
          check-latest: true
          cache: maven
          cache-dependency-path: |
            pom.xml
            .github/workflows/playwright.yml

      - name: Install ${{ matrix.browser }}
        run: mvn -B -ntp exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps ${{ matrix.browser }}"

      - name: Run tests
        run: mvn -B -ntp test -Dbrowser=${{ matrix.browser }}

      - name: Build the Allure report
        if: ${{ !cancelled() }}
        run: mvn -B -ntp allure:report

      - name: Upload the Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-report-${{ matrix.browser }}
          path: target/site/allure-maven-plugin/index.html
          retention-days: 14

      - name: Upload failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.browser }}
          path: |
            test-results/
            target/surefire-reports/
          retention-days: 14
